<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VR Ball Sports Gallery</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body { margin: 0; background: #0f1115; }
  </style>

<script>
AFRAME.registerComponent('show-model', {
  schema: {
    message: { type: 'string' },
    model: { type: 'selector' }
  },

  init: function () {
    this.el.addEventListener('click', () => {

      document.querySelector('#infoText')
        .setAttribute('value', this.data.message);

      document.querySelectorAll('.fitness-model')
        .forEach(m => m.setAttribute('visible', false));

      if (this.data.model) {
        this.data.model.setAttribute('visible', true);
      }

    });
  }
});
</script>

</head>

<body>

<a-scene background="color: #0f1115">

  <!-- CAMERA -->
  <a-entity position="0 0 3" wasd-controls>
    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor raycaster="objects: .clickable"
                color="#ffffff">
      </a-cursor>
    </a-entity>
  </a-entity>

  <!-- LIGHTING (PROFESSIONAL SETUP) -->
  <a-light type="ambient" intensity="0.5" color="#ffffff"></a-light>

  <a-light type="directional"
           position="2 5 3"
           intensity="0.8"
           color="#ffffff">
  </a-light>

  <a-light type="directional"
           position="-2 5 -3"
           intensity="0.4"
           color="#cccccc">
  </a-light>

  <!-- FLOOR -->
  <a-plane position="0 -1 0"
           rotation="-90 0 0"
           width="12" height="12"
           color="#1a1d23"
           material="roughness: 0.9; metalness: 0.1">
  </a-plane>

  <!-- ================= MINIMAL WALLS ================= -->

  <!-- BACK WALL -->
  <a-plane position="0 2 -6"
           width="12" height="5"
           color="#181a1f"
           material="roughness: 1">
  </a-plane>

  <!-- LEFT WALL -->
  <a-plane position="-6 2 0"
           rotation="0 90 0"
           width="12" height="5"
           color="#16181d"
           material="roughness: 1">
  </a-plane>

  <!-- RIGHT WALL -->
  <a-plane position="6 2 0"
           rotation="0 -90 0"
           width="12" height="5"
           color="#16181d"
           material="roughness: 1">
  </a-plane>

  <!-- CEILING -->
  <a-plane position="0 5 0"
           rotation="90 0 0"
           width="12" height="12"
           color="#20242b">
  </a-plane>

  <!-- TITLE TEXT -->
  <a-text id="infoText"
          value="Ball Sports Gallery"
          position="0 4 -5.8"
          align="center"
          width="10"
          color="#e6e6e6">
  </a-text>

  <!-- ================= MODELS ================= -->

  <a-entity id="basketball3D" class="fitness-model"
            gltf-model="models/basketball.glb"
            position="0 0 2"
            scale="0.6 0.6 0.6"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
  </a-entity>

  <a-entity id="football3D" class="fitness-model"
            gltf-model="models/soccer_ball__football.glb"
            position="0 0 2"
            scale="3 3 3"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
  </a-entity>

  <a-entity id="golfball3D" class="fitness-model"
            gltf-model="models/golf_ball_low-poly.glb"
            position="0 0 2"
            scale="2 2 2"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
  </a-entity>

  <a-entity id="volleyball3D" class="fitness-model"
            gltf-model="models/generic_volleyball_ball_low-poly.glb"
            position="0 0 2"
            scale="3 3 3"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
  </a-entity>

  <a-entity id="cricketball3D" class="fitness-model"
            gltf-model="models/tennis_ball.glb"
            position="0 0 2"
            scale="0.1 0.1 0.1"
            visible="false"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000">
  </a-entity>

  <!-- ================= POSTERS ================= -->

  <a-plane class="clickable"
           src="images/basketball.png"
           position="-3 1.6 -5.9"
           width="2" height="2"
           material="shader: standard; roughness: 0.5"
           show-model="message: Basketball; model: #basketball3D">
  </a-plane>

  <a-plane class="clickable"
           src="images/football.png"
           position="0 1.6 -5.9"
           width="2" height="2"
           show-model="message: Football; model: #football3D">
  </a-plane>

  <a-plane class="clickable"
           src="images/golfball.png"
           position="3 1.6 -5.9"
           width="2" height="2"
           show-model="message: Golf Ball; model: #golfball3D">
  </a-plane>

  <a-plane class="clickable"
           src="images/volleyball.png"
           position="-5.8 1.6 0"
           rotation="0 90 0"
           width="2" height="2"
           show-model="message: Volleyball; model: #volleyball3D">
  </a-plane>

  <a-plane class="clickable"
           src="images/cricketball.png"
           position="5.8 1.6 0"
           rotation="0 -90 0"
           width="2" height="2"
           show-model="message: Cricket Ball; model: #cricketball3D">
  </a-plane>

</a-scene>

</body>
</html>
